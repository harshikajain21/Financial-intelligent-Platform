services:
  - type: web
    name: financial-intelligence-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: '["https://financial-intelligence-frontend.onrender.com","http://localhost:3000"]'

  - type: web
    name: financial-intelligence-frontend
    env: static
    buildCommand: "cd dashboard && npm install && npm run build"
    staticPublishPath: "./dashboard/build"
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: financial-intelligence-backend
          property: host
